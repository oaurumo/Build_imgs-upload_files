name: Build Armbian

on:
  workflow_dispatch:
    inputs:
      board:
        description: '目标开发板 (如: odroidn2, rock-5b, uefi-x86)'
        required: true
        default: 'uefi-x86'
      release:
        description: '基础发行版 (bookworm/noble/jammy)'
        required: true
        default: 'noble'
      branch:
        description: 'Armbian 分支 (current/edge/legacy)'
        required: true
        default: 'current'
      build_desktop:
        description: '是否构建桌面环境'
        required: true
        type: boolean
        default: false
      armbian_branch:
        description: 'Armbian Build Framework 分支 (如: v24.11, main)'
        required: true
        default: 'main'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      # ── 1. 检出代码 ──
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. 释放磁盘空间 (Armbian 编译需要 ~50GB) ──
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/share/swift /usr/local/.ghcup
          sudo apt-get clean
          df -h

      # ── 3. 安装编译依赖 ──
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential bc kmod cpio flex libncurses5-dev \
            libelf-dev libssl-dev dwarves bison rsync pkg-config \
            device-tree-compiler wget curl xz-utils
          sudo apt-get autoremove --purge -y

      # ── 4. 克隆 Armbian Build Framework ──
      - name: Clone Armbian Build Framework
        run: |
          git clone --single-branch --depth=1 \
            --branch=${{ github.event.inputs.armbian_branch || 'main' }} \
            https://github.com/armbian/build.git armbian-build

      # ── 5. 配置国内镜像加速（可选，国内网络环境建议开启） ──
      - name: Configure China mirror
        run: |
          cat > armbian-build/userpatches/config-download-mirror.conf << 'EOF'
          DOWNLOAD_MIRROR="china"
          EOF

      # ── 6. 编译 Armbian 镜像 ──
      - name: Build Armbian
        run: |
          cd armbian-build
          ./compile.sh \
            BOARD="${{ github.event.inputs.board || 'uefi-x86' }}" \
            BRANCH="${{ github.event.inputs.branch || 'current' }}" \
            RELEASE="${{ github.event.inputs.release || 'noble' }}" \
            BUILD_DESKTOP="${{ github.event.inputs.build_desktop || 'no' }}" \
            BUILD_MINIMAL=no \
            EXPERT=yes \
            KERNEL_CONFIGURE=no \
            CLEAN_LEVEL="make,cache" \
            COMPRESS_OUTPUTIMAGE="sha,xz"
        env:
          # 如果编译时间很长，可以设置超时（单位：秒）
          ARMBIAN_CACHE_ROOTFS: "yes"

      # ── 7. 收集编译产物 ──
      - name: Collect build artifacts
        run: |
          mkdir -p release-assets
          # 复制所有生成的镜像文件
          cp armbian-build/output/images/*.img* release-assets/ 2>/dev/null || true
          cp armbian-build/output/images/*.sha release-assets/ 2>/dev/null || true
          cp armbian-build/output/images/*.txt release-assets/ 2>/dev/null || true
          # 列出产物
          ls -lh release-assets/

      # ── 8. 上传为构建产物（供调试下载） ──
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: armbian-images-${{ github.event.inputs.board || 'uefi-x86' }}
          path: armbian-build/output/images/
          retention-days: 7
          compression-level: 0

      # ── 9. 创建 GitHub Release 并上传镜像 ──
      - name: Create Release and upload images
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('armbian-{0}-{1}', github.event.inputs.board, github.run_number) }}
          name: Armbian ${{ github.event.inputs.board || 'uefi-x86' }} - ${{ github.event.inputs.release || 'noble' }}
          body: |
            ## Armbian 构建信息

            | 项目 | 值 |
            |------|------|
            | 开发板 | `${{ github.event.inputs.board || 'uefi-x86' }}` |
            | 发行版 | `${{ github.event.inputs.release || 'noble' }}` |
            | 分支 | `${{ github.event.inputs.branch || 'current' }}` |
            | 桌面环境 | `${{ github.event.inputs.build_desktop || 'no' }}` |
            | 构建时间 | ${{ github.event.inputs.build_desktop && '是' || '否' }} |
            | 触发方式 | ${{ github.event_name == 'workflow_dispatch' && '手动触发' || 'Tag 推送' }} |

            > 镜像已压缩为 xz 格式，附带 SHA 校验文件。
          files: |
            release-assets/*
          draft: false
          prerelease: ${{ github.ref_type != 'tag' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
