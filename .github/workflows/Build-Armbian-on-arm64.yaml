name: Build Armbian Arm64

on:
  workflow_dispatch:
    inputs:
      board:
        description: ' ( odroidn2, rock-5b...)'
        required: true
        default: 'odroidm1'
      release:
        description: '(trixie/bookworm/resolute/noble/jammy)'
        required: true
        default: 'noble'
      branch:
        description: ' (current/edge/legacy)'
        required: true
        default: 'current'
      tag:
        description: '自定义 Release Tag（如 v1.0.0，留空自动生成）'
        required: false
        default: ''

  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      # ── 1. 检出代码 ──
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. 释放磁盘空间 (Armbian 编译需要 ~50GB) ──
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/share/swift /usr/local/.ghcup
          sudo apt-get clean
          df -h

      # ── 3. 安装编译依赖 ──
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential bc kmod cpio flex libncurses5-dev \
            libelf-dev libssl-dev dwarves bison rsync pkg-config \
            device-tree-compiler wget curl xz-utils
          sudo apt-get autoremove --purge -y

      # ── 4. 克隆 Armbian Build Framework ──
      - name: Clone Armbian Build Framework
        run: |
          git clone --single-branch --depth=1 \
            --branch=${{ github.event.inputs.armbian_branch || 'main' }} \
            https://github.com/armbian/build.git armbian-build

      # ── 5. 编译 Armbian 镜像 ──
      - name: Build Armbian
        run: |
          cd armbian-build
          ./compile.sh \
            BOARD="${{ github.event.inputs.board || 'uefi-x86' }}" \
            BRANCH="${{ github.event.inputs.branch || 'current' }}" \
            RELEASE="${{ github.event.inputs.release || 'noble' }}" \
            BUILD_DESKTOP=no \
            BUILD_MINIMAL=yes \
            EXPERT=yes \
            KERNEL_CONFIGURE=no \
            CLEAN_LEVEL="make,cache" \
            KERNEL_BTF=no \
            COMPRESS_OUTPUTIMAGE="sha,img"

          cd output/images/
          rm *.img
          cd ../..
          # sudo tar -cpf build.tar  action.yml compile.sh CONTRIBUTING.md Dockerfile lib output patch renovate.json5 shell.nix userpatches cache config CREDITS.md extensions LICENSE packages README.md requirements.txt tools VERSION
          tar -cpf - action.yml compile.sh CONTRIBUTING.md Dockerfile lib output patch renovate.json5 shell.nix userpatches cache config CREDITS.md extensions LICENSE packages README.md requirements.txt tools VERSION | xz | split -b 1900m - build.tar.xz.
          mv *.xz* output/images/
          mv *.xz output/images/
          cd output/images/
          #sudo split -b 1990M build.tar build.tar.xz.part-
          # tar -cf - build | xz -9 | split -d -b 1900m - armbian_build.tar.xz.
          # tar -cf - build | xz -9 -T0 --memlimit-compress=2G | split -d -b 1900m - armbian_build.tar.xz.
          # mv *.xz.* output/images/
          # sudo xz -9 *.img
        env:
          ARMBIAN_CACHE_ROOTFS: "yes"

      # ── 6. 收集编译产物 ──
      - name: Collect build artifacts
        run: |
          mkdir -p release-assets
          cp armbian-build/output/images/*.xz release-assets/ 2>/dev/null || true
          cp armbian-build/output/images/*.xz* release-assets/ 2>/dev/null || true
          ls -lh release-assets/

      # ── 7. 创建 GitHub Release 并上传镜像 ──
      - name: Create Release and upload images
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: >-
            ${{
              github.event.inputs.tag != '' &&
              github.event.inputs.tag ||
              (github.ref_type == 'tag' && github.ref_name) ||
              format('armbian-{0}-{1}', github.event.inputs.board, github.run_number)
            }}
          name: Armbian ${{ github.event.inputs.board || 'uefi-x86' }} - ${{ github.event.inputs.release || 'noble' }}
          body: |
            ## Armbian 构建信息

            | 项目 | 值 |
            |------|------|
            | 开发板 | `${{ github.event.inputs.board || 'odroidn2' }}` |
            | 发行版 | `${{ github.event.inputs.release || 'noble' }}` |
            | 分支 | `${{ github.event.inputs.branch || 'current' }}` |            
            | 触发方式 | ${{ github.event_name == 'workflow_dispatch' && '手动触发' || 'Tag 推送' }} |

            > 镜像已压缩为 xz 格式，附带 SHA 校验文件。
          files: |
            release-assets/*
          draft: false
          prerelease: ${{ github.ref_type != 'tag' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.CUSTOM_GITHUB_TOKEN }}
